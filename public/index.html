<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#F7F2E7">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spain & Portugal">
<title>Spain & Portugal · 2026</title>
<style>
  :root{
    --paper: #F7F2E7;
    --paper-raised: #FCFAF3;
    --ink: #2A2420;
    --ink-soft: #6B6058;
    --line: #DCD2BE;
    --line-soft: #E9E1CF;
    --teal: #2E5750;
    --teal-deep: #1E3E39;
    --gold: #B4802E;
    --owe: #A64B3F;
    --owed: #3C6B4F;
    --radius: 12px;
    --shadow: 0 1px 0 rgba(42,36,32,0.06);
    --tap: 44px;
    --font-serif: 'Seravek', ui-rounded, -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', 'Segoe UI', Roboto, sans-serif;
    --font-sans: 'Seravek', ui-rounded, -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    /* 每段行程一个颜色，用于地图路线与当日城市标签 */
    --c0:#B5651D; --c1:#3F6E8C; --c2:#6B8E4E; --c3:#A85B7C;
    --c4:#2F8577; --c5:#C79A3B; --c6:#5B5A8C; --c7:#B4534A;
    transition: background .4s, color .4s;
  }
  html.night{
    --paper:#1B2320; --paper-raised:#232E2A; --ink:#EDE7DA; --ink-soft:#B7AE9C;
    --line:#3A453F; --line-soft:#2C3630; --teal:#7FBDAE; --teal-deep:#A9D8C9;
    --gold:#E0B25C; --owe:#E08B7D; --owed:#8FD1AE;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper); color: var(--ink);
    font-family: var(--font-sans); font-size: 16px; line-height: 1.6;
    padding: 20px 14px 90px;
  }
  .wrap{ max-width: 720px; margin: 0 auto; }
  a{ color: var(--teal-deep); }
  h1,h2,h3{ font-family: var(--font-serif); color: var(--teal-deep); margin:0; }
  section{ margin-top: 30px; }
  h2{ font-size:19px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .en{ color: var(--ink-soft); font-weight:400; font-size:0.82em; }
  .card{
    background: var(--paper-raised); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .top-nav{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .top-nav a{ font-size:12.5px; text-decoration:none; border-bottom:1px dotted var(--ink-soft); }

  /* ---------- What's next ---------- */
  .next-card{
    background: linear-gradient(135deg, var(--teal-deep), var(--teal));
    color:#F7F2E7; border-radius: var(--radius); padding:20px; text-align:center;
  }
  .next-card .eyebrow{ font-size:28px; font-weight:800; letter-spacing:0.01em; color: var(--gold); }
  .next-card .label{ font-family:var(--font-serif); font-size:19px; margin:8px 0 14px; color:#F7F2E7; font-weight:500; }
  .countdown{ display:flex; justify-content:center; gap:18px; }
  .countdown .num{ font-family:var(--font-mono); font-size:34px; font-weight:600; color:#D9F2EC; }
  .countdown .unit{ font-size:11px; opacity:0.8; }
  .next-card .localtime{ margin-top:12px; font-size:12px; opacity:0.8; }

  /* ---------- Map ---------- */
  .map-card{ padding:8px; overflow:hidden; }
  svg#routeMap{ width:100%; height:auto; display:block; }
  .city-label{ font-family: var(--font-sans); font-size:11px; fill: var(--ink); }
  .city-en{ font-size:8.5px; fill: var(--ink-soft); }

  /* ---------- Calendar ---------- */
  .cal-wrap{ padding:14px 8px 4px; }
  .cal-month-title{ font-family:var(--font-serif); font-weight:700; font-size:14px; color:var(--teal-deep); margin-bottom:8px; }
  .cal-week-row, .cal-days{ display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
  .cal-week-row span{ font-size:11px; color:var(--ink-soft); text-align:center; padding-bottom:4px; }
  .cal-cell{
    aspect-ratio:0.8; border-radius:7px; border:1px solid var(--line-soft);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:11px; color:var(--ink); position:relative; gap:2px; padding:3px 2px;
  }
  .cal-cell.empty{ border:none; }
  .cal-cell.cal-transit{ background: repeating-linear-gradient(45deg, var(--line-soft), var(--line-soft) 3px, var(--paper-raised) 3px, var(--paper-raised) 6px); }
  .cal-daynum{ font-family:var(--font-mono); font-size:13px; font-weight:600; }
  .cal-city-label{ font-size:11px; font-weight:700; line-height:1.15; text-align:center; word-break:break-all; }
  .cal-icon{ position:absolute; top:1px; right:2px; font-size:13px; line-height:1; }

  /* ---------- Confirmed bookings ---------- */
  .booking-item{ border-left:3px solid var(--line); padding:8px 0 8px 12px; margin-bottom:6px; }
  .booking-item.flight{ border-left-color: var(--teal); }
  .booking-item.car{ border-left-color: var(--gold); }
  .booking-item .b-title{ font-weight:600; font-size:14.5px; }
  .booking-item .b-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.6; }
  .booking-item .b-meta a{ text-decoration:none; }
  .subhead{ font-size:13px; color:var(--ink-soft); margin:16px 0 8px; font-weight:600; }
  .subhead:first-child{ margin-top:0; }

  /* ---------- Day by day ---------- */
  .day-card{ border-radius: var(--radius); margin-bottom:12px; overflow:hidden; border:1px solid var(--line); }
  .day-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; cursor:pointer; background: var(--paper-raised);
  }
  .day-head .d-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .day-dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .day-title{ font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .day-date{ font-size:12px; color:var(--ink-soft); flex:0 0 auto; }
  .day-caret{ transition: transform .2s; color: var(--ink-soft); flex:0 0 auto; }
  .day-card.open .day-caret{ transform: rotate(90deg); }
  .day-body{ display:none; padding:6px 14px 14px; }
  .day-card.open .day-body{ display:block; }
  .day-nav-btn{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px;
    background: var(--paper); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; text-decoration:none; color:var(--teal-deep); margin-bottom:10px;
  }
  .warn-banner{
    background: rgba(166,75,63,0.1); border:1px solid var(--owe); color:var(--owe);
    border-radius:8px; padding:8px 10px; font-size:12.5px; margin-bottom:10px; line-height:1.5;
  }
  .timeline-item{ display:flex; gap:12px; padding:7px 0; border-bottom:1px solid var(--line-soft); }
  .timeline-item:last-child{ border-bottom:none; }
  .ti-time{ flex:0 0 58px; font-family:var(--font-mono); font-size:13px; color:var(--ink-soft); padding-top:1px; }
  .ti-time.est::after{ content:'*'; }
  .ti-content{ flex:1 1 auto; font-size:14px; }
  .ti-content a{ text-decoration:none; border-bottom:1px dotted var(--teal); }
  .book-flag{
    display:inline-block; font-size:11px; background: var(--gold); color:#fff;
    border-radius:5px; padding:1px 6px; margin-left:6px; vertical-align:1px;
  }
  .note-input{
    display:block; width:100%; margin-top:6px; padding:6px 9px;
    border:1px dashed var(--line); border-radius:7px; background:var(--paper);
    color:var(--ink-soft); font-family:var(--font-sans); font-size:12.5px; outline:none;
  }
  .note-input:focus{ border-color:var(--gold); border-style:solid; color:var(--ink); }
  .note-input:not(:placeholder-shown){ border-style:solid; }
  .todo-note-input{ margin-left:29px; width:calc(100% - 29px); margin-bottom:8px; }
  .est-note{ font-size:11px; color:var(--ink-soft); margin-top:6px; }
  .overnight-note{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .hotel-detail{ margin-top:4px; font-size:12px; }
  .hotel-detail a{ text-decoration:none; border-bottom:1px dotted var(--ink-soft); }
  .hotel-jump-note{ font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-bottom:4px; }

  /* ---------- 灵活活动（可调整顺序/移到别天） ---------- */
  .flex-section{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); }
  .flex-heading{ font-size:12px; font-weight:600; color:var(--teal-deep); margin-bottom:8px; }
  .flex-heading .en{ font-weight:400; color:var(--ink-soft); font-size:11px; }
  .flex-empty{ font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-bottom:8px; }
  .flex-card{
    background: var(--paper-raised); border:1px solid var(--line-soft); border-radius:8px;
    padding:8px 10px; margin-bottom:8px;
  }
  .flex-card-main{ font-size:13.5px; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .flex-time-input{
    font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
    border:1px dashed var(--line); border-radius:5px; background:var(--paper);
    padding:2px 6px; width:64px; flex:0 0 auto;
  }
  .flex-time-input:focus{ border-style:solid; border-color:var(--gold); color:var(--ink); outline:none; }
  .flex-card-controls{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .flex-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer;
    width:36px; height:36px; border-radius:8px; font-size:15px; line-height:1;
  }
  .flex-btn:disabled{ opacity:0.3; cursor:default; }
  .flex-btn.flex-del{ color:var(--owe); border-color:var(--owe); }
  .flex-btn.flex-confirm{ color:#fff; background:var(--owed); border-color:var(--owed); width:auto; padding:0 12px; font-size:13px; font-weight:600; }
  .flex-move{
    font-size:13px; border:1px solid var(--line); border-radius:8px; padding:8px 6px;
    background:var(--paper); color:var(--ink-soft); max-width:110px; height:36px;
  }
  .flex-add-btn{
    display:block; width:100%; border:1px dashed var(--line); background:transparent;
    color:var(--teal-deep); border-radius:8px; padding:8px; font-size:13px; cursor:pointer;
    font-family:var(--font-sans); font-weight:600;
  }
  .flex-add-btn:hover{ border-color:var(--teal); background:var(--paper-raised); }

  /* ---------- Todo / tips ---------- */
  .plain-list{ margin:0; padding-left:0; list-style:none; }
  .plain-list li{ padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:14px; }
  .plain-list li:last-child{ border-bottom:none; }
  .plain-list .urgent{ color: var(--owe); font-weight:600; }
  .plain-list .tag{
    font-size:10.5px; border-radius:5px; padding:1px 6px; margin-left:6px;
    background: var(--line-soft); color: var(--ink-soft);
  }
  .plain-list .tag.hot{ background: var(--owe); color:#fff; }
  .todo-li{ padding:0; }
  .todo-row{ display:flex; align-items:flex-start; gap:10px; cursor:pointer; padding:8px 0; }
  .todo-check{ width:19px; height:19px; margin-top:2px; flex:0 0 auto; accent-color: var(--teal); cursor:pointer; }
  .todo-text{ flex:1 1 auto; font-size:14px; }
  .todo-note{ color:var(--ink-soft); font-size:12.5px; }
  .todo-li.done .todo-text{ text-decoration: line-through; color: var(--ink-soft); }
  .todo-li.done .todo-note{ text-decoration:none; color: var(--owed); font-weight:600; }

  /* ---------- Confirm modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-card{
    background: var(--paper-raised); border-radius: var(--radius); padding:20px;
    max-width:340px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .modal-title{ font-family:var(--font-serif); font-weight:700; font-size:16px; color:var(--teal-deep); margin-bottom:12px; }
  .modal-card input[type=text]{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    background:#fff; color:var(--ink); font-family:var(--font-sans); font-size:15px; outline:none;
  }
  .modal-card input[type=text]:focus{ border-color: var(--teal); }
  .modal-card .field-label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; }
  .modal-card input{ margin-bottom:0; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .btn{ border:none; border-radius:8px; padding:9px 16px; font-family:var(--font-sans); font-weight:600; font-size:14px; cursor:pointer; }
  .btn-primary{ background: var(--teal); color:#fff; }
  .btn-primary:hover{ background: var(--teal-deep); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--owe); color:var(--owe); }

  footer{ margin-top:36px; font-size:12px; color:var(--ink-soft); text-align:center; }
</style>
</head>

<div class="wrap">

  <div class="top-nav">

  <section>

<script>
(function(){
  const $ = id => document.getElementById(id);

  /* ================= 日夜主题：跟随打开网页那个人的设备时间 ================= */
  function applyTheme(){
    const h = new Date().getHours();
    document.documentElement.classList.toggle('night', h < 6 || h >= 19);
  }
  applyTheme();
  setInterval(applyTheme, 60000);

  /* ================= 城市颜色 ================= */
  const CITY_COLOR = {
    madrid:'var(--c0)', salamanca:'var(--c1)', porto:'var(--c2)', lisbon:'var(--c3)',
    faro:'var(--c4)', sevilla:'var(--c5)', ronda:'var(--c6)', barcelona:'var(--c7)'
  };

  /* ================= Google Maps 导航链接 ================= */
  function navLink(place){
    if(place.lat) return `https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}`;
    return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(place.q)}`;
  }
  function dayNavLink(stops){
    if(!stops || stops.length < 2) return null;
    const fmt = s => s.lat ? `${s.lat},${s.lng}` : encodeURIComponent(s.q);
    const origin = fmt(stops[0]);
    const destination = fmt(stops[stops.length-1]);
    const waypoints = stops.slice(1,-1).map(fmt).join('|');
    let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
    if(waypoints) url += `&waypoints=${waypoints}`;
    return url;
  }
  function placeLink(name, place){
    return `<a href="${navLink(place)}" target="_blank" rel="noopener">${name}</a>`;
  }

  /* ================= 数据：已确认预订 ================= */

  /* ================= 灵活活动：可调整顺序 / 移到别天 / 新增 / 删除 =================
     只有「预估时段、不需要订票」的项目才会变成可调整的卡片；机票、已订门票、
     固定时间的项目维持原样、不能动，避免跟实际订票状态脱节。 */
  const flexRegistry = {}; // { id: { label, t } }
  const flexOrder = {};    // { dayId: [id, id, ...] }
  const confirmedFlex = {}; // { dayId: [ {id, t, label}, ... ] } —— 已确认插入固定时间线的灵活活动
  let flexSeq = 0;

  function timeSortKey(t){
    if(!t) return 720;
    const hhmm = t.match(/(\d{1,2}):(\d{2})/);
    if(hhmm) return parseInt(hhmm[1],10)*60 + parseInt(hhmm[2],10);
    if(t.includes('凌晨')) return 60;
    if(t.includes('全天') || t.includes('早出发') || t.includes('清晨')) return 480;
    if(t.includes('上午')) return 540;
    if(t.includes('中午')) return 720;
    if(t.includes('下午') || t.includes('午后')) return 840;
    if(t.includes('傍晚')) return 1080;
    if(t.includes('晚上') || t.includes('夜')) return 1200;
    if(t.includes('最晚')) return 1065;
    return 720;
  }

  function applyConfirmedFlexOverlay(){
    Object.entries(confirmedFlex).forEach(([dayId, list]) => {
      const day = days.find(x => x.id === dayId);
      if(!day) return;
      list.forEach(entry => {
        if(!day.items.some(it => it.id === entry.id)){
          day.items.push({ t:entry.t, label:entry.label, est:true, id:entry.id });
        }
      });
      day.items.sort((a,b) => timeSortKey(a.t) - timeSortKey(b.t));
    });
  }

  function extractFlexItems(){
    days.forEach(d => {
      flexOrder[d.id] = flexOrder[d.id] || [];
      d.items = d.items.filter(it => {
        if(it.est && !it.book){
          const id = it.id || `flex-${d.id}-${flexSeq++}`;
          flexRegistry[id] = { label: it.label, t: it.t || '' };
          flexOrder[d.id].push(id);
          return false; // 从固定列表里移除，改由灵活区块渲染
        }
        return true;
      });
    });
  }

  function dayLabel(dayId){
    const d = days.find(x => x.id === dayId);
    return d ? `D${d.id.slice(1)} ${d.date.slice(5)} ${d.city}` : dayId;
  }

  function buildFlexSectionHtml(dayId){
    const ids = flexOrder[dayId] || [];
    let html = `<div class="flex-section"><div class="flex-heading">灵活活动 <span class="en">可调整顺序 / 移到别天</span></div>`;
    if(ids.length === 0){
      html += `<div class="flex-empty">暂无</div>`;
    } else {
      ids.forEach((id, idx) => {
        const item = flexRegistry[id];
        if(!item) return;
        const dayOptions = days.map(d => `<option value="${d.id}" ${d.id===dayId?'selected':''}>${dayLabel(d.id)}</option>`).join('');
        const labelHtml = item.label.includes('<a ') ? item.label : (item.q ? placeLink(item.label, {q:item.q}) : item.label);
        html += `
          <div class="flex-card" data-flex-id="${id}">
            <div class="flex-card-main">
              <input type="text" class="flex-time-input" data-flex-time-id="${id}" value="${escapeAttr(item.t)}" placeholder="时间">
              <span class="flex-label">${labelHtml}</span>
            </div>
            <div class="flex-card-controls">
              <button class="flex-btn flex-confirm" data-act="confirm" title="确认插入当天时间线">✓ 确认</button>
              <button class="flex-btn" data-act="up" ${idx===0?'disabled':''} title="往前移">▲</button>
              <button class="flex-btn" data-act="down" ${idx===ids.length-1?'disabled':''} title="往后移">▼</button>
              <select class="flex-move" data-act="move">${dayOptions}</select>
              <button class="flex-btn flex-del" data-act="del" title="删除">×</button>
            </div>
          </div>`;
      });
    }
    html += `<button class="flex-add-btn" data-add-day="${dayId}">+ 添加活动</button></div>`;
    return html;
  }

  function wireFlexSection(card, dayId){
    card.querySelectorAll('.flex-time-input').forEach(inp => {
      let t = null;
      inp.addEventListener('input', () => {
        const id = inp.dataset.flexTimeId;
        clearTimeout(t);
        t = setTimeout(() => {
          if(flexRegistry[id]){ flexRegistry[id].t = inp.value.trim(); queueSaveTodo(); }
        }, 400);
      });
    });
    card.querySelectorAll('.flex-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.closest('.flex-card').dataset.flexId;
        const act = btn.dataset.act;
        const arr = flexOrder[dayId];
        const i = arr.indexOf(id);
        if(act === 'up' && i > 0){ [arr[i-1],arr[i]] = [arr[i],arr[i-1]]; }
        if(act === 'down' && i < arr.length-1){ [arr[i+1],arr[i]] = [arr[i],arr[i+1]]; }
        if(act === 'del'){ arr.splice(i,1); delete flexRegistry[id]; }
        if(act === 'confirm'){
          const item = flexRegistry[id];
          if(item){
            if(!item.t.trim()){
              alert('确认插入时间线前，麻烦先填一个具体时间（比如 09:00），这样才能排到正确的位置。');
              return;
            }
            arr.splice(i,1); delete flexRegistry[id];
            const day = days.find(x => x.id === dayId);
            day.items.push({ t:item.t, label:item.label, est:true, id });
            day.items.sort((a,b) => timeSortKey(a.t) - timeSortKey(b.t));
            confirmedFlex[dayId] = confirmedFlex[dayId] || [];
            confirmedFlex[dayId].push({ id, t:item.t, label:item.label });
          }
        }
        queueSaveTodo();
        renderDayBody(days.find(x => x.id === dayId));
      });
    });
    card.querySelectorAll('.flex-move').forEach(sel => {
      sel.addEventListener('change', () => {
        const id = sel.closest('.flex-card').dataset.flexId;
        const newDay = sel.value;
        if(newDay === dayId) return;
        flexOrder[dayId] = flexOrder[dayId].filter(x => x !== id);
        flexOrder[newDay] = flexOrder[newDay] || [];
        flexOrder[newDay].push(id);
        queueSaveTodo();
        renderDayBody(days.find(x => x.id === dayId));
        renderDayBody(days.find(x => x.id === newDay));
      });
    });
    const addBtn = card.querySelector('.flex-add-btn');
    if(addBtn){
      addBtn.addEventListener('click', () => openAddFlexModal(dayId));
    }
  }

    d.items.forEach(it => {

    body += buildFlexSectionHtml(d.id);
    if(d.overnightId){
      const hotel = bookings.hotels.find(h => h.id === d.overnightId);

        </div>`;

      body += `<div class="overnight-note">🛏 ${d.overnight}</div>`;

  /* ---------------- 待办勾选 → 弹窗问时间 → 更新行程 ---------------- */
  const todoState = {}; // { [target]: { done:true, info:'...', note:'...' } }
  const notesState = {}; // { [itemId]: '可预订时间备注' } —— 还没订的行程项旁边的自由笔记
  const originalLabels = {}; // 记录每个 id 原始文案，方便取消勾选时还原

  function findItemById(id){
    for(const d of days){
      const it = (d.items||[]).find(x => x.id === id);
      if(it) return {day:d, item:it};
    }
    // 也找目前还在「灵活活动」区块里的（比如还没确认成固定时间线的项目）
    for(const dayId of Object.keys(flexOrder)){
      if((flexOrder[dayId]||[]).includes(id) && flexRegistry[id]){
        return { day: days.find(x => x.id === dayId), item: flexRegistry[id] };
      }
    }
    return null;
  }

  function applyConfirmed(target, info){
    if(target === 'car-phone'){
      bookings.car[2].meta = `联系电话：${info}`;
      renderBookings();
      return;
    }
    const found = findItemById(target);
    if(!found) return;
    const { day, item } = found;
    if(originalLabels[target] === undefined) originalLabels[target] = { t:item.t, label:item.label, book:item.book };
    item.label = item.label.replace('〔待订〕', '') + `（已订 ${info}）`;
    item.book = false;
    renderDayBody(day);
  }

  function revertConfirmed(target){

    }
    const found = findItemById(target);
    const orig = originalLabels[target];

    found.item.t = orig.t; found.item.label = orig.label; found.item.book = orig.book;

  /* ================= 待办状态：Worker + KV 共享同步 ================= */
  const TODO_API = '/api/trip-todo';
  const TODO_LOCAL_KEY = 'trip-todo-state-v2';
  let todoSaveTimer = null;

  function applyLoadedPayload(payload){
    if(!payload) return;
    // 新格式 { todo:{...}, notes:{...}, flexOrder:{...}, flexRegistry:{...}, confirmedFlex:{...} }；兼容旧的纯 todoState 格式
    const todoPart = payload.todo || payload;
    const notesPart = payload.notes || {};
    Object.assign(todoState, todoPart);
    Object.assign(notesState, notesPart);
    if(payload.flexOrder && payload.flexRegistry){
      // 用存下来的版本整个取代默认值——这是「目前真正的状态」
      Object.keys(flexOrder).forEach(k => delete flexOrder[k]);
      Object.assign(flexOrder, payload.flexOrder);
      Object.keys(flexRegistry).forEach(k => delete flexRegistry[k]);
      Object.assign(flexRegistry, payload.flexRegistry);
    }
    if(payload.confirmedFlex){
      Object.keys(confirmedFlex).forEach(k => delete confirmedFlex[k]);
      Object.assign(confirmedFlex, payload.confirmedFlex);
      applyConfirmedFlexOverlay();
    }
    Object.entries(todoState).forEach(([target, s]) => { if(s.done) applyConfirmed(target, s.info); });
  }

  async function loadTodoState(){
    try{
      const local = localStorage.getItem(TODO_LOCAL_KEY);
      if(local) applyLoadedPayload(JSON.parse(local));
    }catch(err){}
    renderTodo(); renderBookings();
    document.querySelectorAll('.day-card').forEach(card => renderDayBody(days.find(d => d.id === card.dataset.id)));

    try{
      const res = await fetch(TODO_API, { cache:'no-store' });
      if(res.ok){
        const text = await res.text();
        if(text && text !== '{}'){
          applyLoadedPayload(JSON.parse(text));
          localStorage.setItem(TODO_LOCAL_KEY, text);
          renderTodo(); renderBookings();
          document.querySelectorAll('.day-card').forEach(card => renderDayBody(days.find(d => d.id === card.dataset.id)));
        }
      }
    }catch(err){ /* 离线：用本地缓存即可 */ }
  }

  function queueSaveTodo(){
    clearTimeout(todoSaveTimer);
    todoSaveTimer = setTimeout(async () => {
      const json = JSON.stringify({ todo: todoState, notes: notesState, flexOrder, flexRegistry, confirmedFlex });
      try{ localStorage.setItem(TODO_LOCAL_KEY, json); }catch(err){}
      try{
        await fetch(TODO_API, { method:'PUT', headers:{'Content-Type':'application/json'}, body: json });
      }catch(err){ /* 离线：等下次有网络自动重试（load 时会拉取） */ }
    }, 350);
  }

    '西班牙/葡萄牙治安整体不错，但热门景点、地铁站周边要留意扒手，贵重物品别放外袋',
    '建议下载 Google Maps 离线地图（覆盖西班牙、葡萄牙），万一没信号也能导航',
    '长途包车路段较多，建议随身带水和晕车药，特别是萨拉曼卡→波尔图、波尔图→里斯本这两段'
  ];
  function renderTips(){
    $('tipsMount').innerHTML = tips.map(t => `<li>${t}</li>`).join('');
  }

  /* ================= 住宿日历：每晚颜色标记 ================= */
  const nightsMap = {
    '2026-09-22':'madrid', '2026-09-23':'madrid', '2026-09-24':'madrid',
    '2026-09-25':'salamanca',
    '2026-09-26':'porto', '2026-09-27':'porto',
    '2026-09-28':'lisbon', '2026-09-29':'lisbon',
    '2026-09-30':'faro',
    '2026-10-01':'sevilla',
    '2026-10-02':'ronda',
    '2026-10-03':'barcelona', '2026-10-04':'barcelona', '2026-10-05':'barcelona', '2026-10-06':'barcelona',
    '2026-10-07':'transit'
  };
  const CITY_FULL = {
    madrid:'马德里', salamanca:'萨拉曼卡', porto:'波尔图', lisbon:'里斯本',
    faro:'法鲁', sevilla:'塞维利亚', ronda:'龙达', barcelona:'巴塞罗那'
  };
  const SPECIAL_ICON = { '2026-09-21':'🛫', '2026-10-08':'🏠' };

  function buildCalendar(){
    const weekLabels = ['日','一','二','三','四','五','六'];
    const start = new Date(2026, 8, 20); // 9/20（周日）
    const end = new Date(2026, 9, 10);   // 10/10（周六）
    let html = `<div class="cal-month-title">2026年9月20日 – 10月10日</div>
      <div class="cal-week-row">${weekLabels.map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="cal-days">`;
    for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
      const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
      const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const night = nightsMap[dateStr];
      const dayLabel = day === 1 ? `${m}/${day}` : day; // 每月1号标出月份避免歧义
      const icon = SPECIAL_ICON[dateStr] ? `<span class="cal-icon">${SPECIAL_ICON[dateStr]}</span>` : '';
      if(night === 'transit'){
        html += `<div class="cal-cell cal-transit">${icon}<span class="cal-daynum">${dayLabel}</span><span class="cal-city-label">转机</span></div>`;
      } else if(night){
        html += `<div class="cal-cell" style="background:color-mix(in srgb, ${CITY_COLOR[night]} 22%, var(--paper-raised)); border-color:${CITY_COLOR[night]}">
          ${icon}<span class="cal-daynum">${dayLabel}</span><span class="cal-city-label" style="color:${CITY_COLOR[night]}">${CITY_FULL[night]}</span></div>`;
      } else {
        html += `<div class="cal-cell">${icon}<span class="cal-daynum">${dayLabel}</span></div>`;
      }
    }
    html += `</div>`;
    $('calMount').innerHTML = html;
  }


  function buildMap(){
    const cities = [
      {key:'madrid', name:'马德里', en:'Madrid', x:485, y:138},
      {key:'toledo', name:'托莱多', en:'Toledo', x:461, y:181, small:true},
      {key:'segovia', name:'塞哥维亚', en:'Segovia', x:453, y:94, small:true},
      {key:'salamanca', name:'萨拉曼卡', en:'Salamanca', x:338, y:93},
      {key:'porto', name:'波尔图', en:'Porto', x:117, y:78},
      {key:'sintra', name:'辛特拉', en:'Sintra', x:58, y:266, small:true},
      {key:'lisbon', name:'里斯本', en:'Lisbon', x:77, y:272},
      {key:'faro', name:'法鲁', en:'Faro', x:168, y:408},
      {key:'sevilla', name:'塞维利亚', en:'Sevilla', x:313, y:379},
      {key:'ronda', name:'龙达', en:'Ronda', x:375, y:431},
      {key:'granada', name:'格拉纳达', en:'Granada', x:493, y:396, small:true},
      {key:'barcelona', name:'巴塞罗那', en:'Barcelona', x:925, y:59}
    ];
    const cityByKey = Object.fromEntries(cities.map(c => [c.key, c]));

    // 手绘感：给直线加一点随机但固定的弯曲弧度
    function wobblyPath(a, b, seed){
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      const dx = b.x-a.x, dy = b.y-a.y;
      const len = Math.sqrt(dx*dx+dy*dy) || 1;
      const nx = -dy/len, ny = dx/len;
      const wig = ((seed * 37) % 17) - 8; // -8..8 的伪随机偏移
      const cx = mx + nx*wig, cy = my + ny*wig;
      return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
    }

    const overnightSegments = [
      { from:'madrid', via:['toledo'], to:'salamanca', via2:['segovia'], color:'var(--c1)' },
      { from:'salamanca', to:'porto', color:'var(--c2)' },
      { from:'porto', via:['sintra'], to:'lisbon', color:'var(--c3)' },
      { from:'lisbon', to:'faro', color:'var(--c4)' },
      { from:'faro', to:'sevilla', color:'var(--c5)' },
      { from:'sevilla', to:'ronda', color:'var(--c6)' },
      { from:'ronda', via:['granada'], to:'barcelona', color:'var(--c7)' }
    ];

    let paths = '';
    let seed = 1;
    overnightSegments.forEach(seg => {
      const chain = [seg.from, ...(seg.via||[]), ...(seg.via2||[]), seg.to];
      for(let i=0;i<chain.length-1;i++){
        const a = cityByKey[chain[i]], b = cityByKey[chain[i+1]];
        paths += `<path d="${wobblyPath(a,b,seed++)}" fill="none" stroke="${seg.color}" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>`;
      }
    });
    // 托莱多是马德里出发的一日游支线，用虚线单独标
    const madrid = cityByKey.madrid, toledo = cityByKey.toledo;
    paths += `<path d="${wobblyPath(madrid,toledo,99)}" fill="none" stroke="var(--c0)" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>`;

    let markers = '';
    cities.forEach(c => {
      const r = c.small ? 3.5 : 5.5;
      const overnight = ['madrid','salamanca','porto','lisbon','faro','sevilla','ronda','barcelona'].includes(c.key);
      const color = `var(--c${['madrid','salamanca','porto','lisbon','faro','sevilla','ronda','barcelona'].indexOf(c.key) >= 0 ? ['madrid','salamanca','porto','lisbon','faro','sevilla','ronda','barcelona'].indexOf(c.key) : 0})`;
      markers += `<a href="${navLink({q:c.en+' Spain Portugal'})}" target="_blank" rel="noopener">
        <circle cx="${c.x}" cy="${c.y}" r="${r}" fill="${color}" stroke="var(--paper)" stroke-width="1.5"/>
        ${overnight ? `<text x="${c.x}" y="${c.y-9}" text-anchor="middle" class="city-label">🛏</text>` : ''}
        <text x="${c.x}" y="${c.y+16}" text-anchor="middle" class="city-label">${c.name}</text>
        <text x="${c.x}" y="${c.y+26}" text-anchor="middle" class="city-en">${c.en}</text>
      </a>`;
    });

    // 简化版半岛轮廓（手绘感：叠加轻微扰动的闭合路径）
    const coast = `M 40,40 C 20,140 30,260 60,320 C 90,400 150,440 220,440
      C 260,460 300,430 340,450 C 400,470 440,430 480,420 C 540,410 560,380 540,340
      C 520,300 480,280 470,230 C 460,170 480,120 450,80 C 400,30 320,20 260,40
      C 200,55 150,20 100,25 C 70,28 50,35 40,40 Z`;

    const svg = `
      <svg id="routeMap" viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg">
        <path d="${coast}" fill="var(--line-soft)" opacity="0.5" stroke="var(--line)" stroke-width="1.5"/>
        ${paths}
        ${markers}
      </svg>`;
    $('mapMount').innerHTML = svg;
  }

  /* ================= 倒计时：What's next（UTC 换算，跨时区不会错） ================= */
  const keyMoments = [
    { label:'CX315 香港 → 马德里 起飞', iso:'2026-09-22T00:45:00+08:00' },
    { label:'CX315 抵达马德里', iso:'2026-09-22T09:15:00+02:00' },
    { label:'阿尔罕布拉宫 (Alhambra) 入场', iso:'2026-10-03T15:30:00+02:00' },
    { label:'VY2015 格拉纳达 → 巴塞罗那 起飞', iso:'2026-10-03T19:30:00+02:00' },
    { label:'圣家堂 (Sagrada Família) 入场', iso:'2026-10-05T12:45:00+02:00' },
    { label:'包车送机（巴塞罗那）', iso:'2026-10-07T19:50:00+02:00' },
    { label:'QR142 巴塞罗那 → 多哈 起飞', iso:'2026-10-07T22:50:00+02:00' },
    { label:'QR816 多哈 → 香港 起飞', iso:'2026-10-08T10:30:00+03:00' },
    { label:'QR816 抵达香港', iso:'2026-10-08T23:25:00+08:00' }
  ];

  function updateCountdown(){
    const now = Date.now();
    const next = keyMoments.find(m => new Date(m.iso).getTime() > now);
    if(!next){
      $('nextLabel').textContent = '行程已结束，欢迎回家 🏠';
      $('cd-d').textContent='0'; $('cd-h').textContent='0'; $('cd-m').textContent='0';
      $('nextLocal').textContent = '';
      return;
    }
    const diff = new Date(next.iso).getTime() - now;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    $('nextLabel').textContent = next.label;
    $('cd-d').textContent = d; $('cd-h').textContent = h; $('cd-m').textContent = m;
    $('nextLocal').textContent = '当地时间 ' + new Date(next.iso).toLocaleString('zh-CN', {
      month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false, timeZone: next.iso.includes('+08:00') ? 'Asia/Hong_Kong' : (next.iso.includes('+03:00') ? 'Asia/Qatar' : 'Europe/Madrid')
    });
  }

  renderBookings();
  renderDays();
  renderTodo();
  renderTips();
  buildMap();
  buildCalendar();
  updateCountdown();
  setInterval(updateCountdown, 30000);
  loadTodoState();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
